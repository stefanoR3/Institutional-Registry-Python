<!-- this template should render inside the registru template, more specific in the deteils-panel section-->
<!doctype HTML>
<html>
    <head>
        <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js" integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg" crossorigin="anonymous"></script>
        <style>
            .form-section{
                    display: flex;
                    flex-direction: column;
                    gap: 20px;
                    border: 1px solid #e5e7eb;
                    border-radius: 6px;
                    padding: 6px;
                    margin-bottom: 20px; /* outer space */
                    width: 280px;
                }

                .form-column{
                    display: flex;
                    flex-direction: column;
                    /*border: 1px solid violet;*/
                    padding: 1.5px;
                }

                .form-row{
                    display: flex; /* puts the inputs side by side */
                    /*gap: 20px;*/
                    justify-content: space-between;
                }

                .input-group{
                    display: flex; /* text on top of the box */
                    flex-direction: column;
                    gap: 6px; /* gap between label and input */
                    /*border: 1px solid; black;*/
                    max-width: 300px;
                }

                .input-group label{
                    font-size: 16px;
                    color: #4b5563;
                    font-weight:bold;
                }

                /* descendent selector(aprent-child replationship) */
                /* find input-group class and apply those rules to any label(tag) inside */
                .input-group input{
                    padding: 8px 4px; /* top-bottom left-right */
                    border: 1px solid #d1d5db;
                    border-radius: 4px;
                    font-size: 14px;
                    outline: none;
                    width: 115px;
                }

                /* add blue ring when clicked inside */
                .input-group input:focus{
                    border-color: yellow;
                    box-shadow: 0 0 0 1.1px rgba(59, 130, 246, 0.3); /* 0.3 = transparency */
                }

                .input-group select{
                    width: 70px;
                }

                #top-menu{
                    width: 100px;
                    height: 100px;
                    border: 5px solid #e5e7eb;
                }
        </style>
    </head>
    <body>
        <div class="form-section" id="top-menu">
            <h1>test</h1>
        </div>
    </body>
</html>
