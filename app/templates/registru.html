{% extends "base.html" %}

{% block head %}
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js" integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg" crossorigin="anonymous"></script>
    <style>
        body{
            background-color: rgba(1, 35, 54, 0.8);
        }
        
        /* layout structure */

        .registry-list{
            display: flex; /* layout mode, used to stack items in column (cards). Flexbox is a html tool for alignment */
            flex-direction: column; /* stacks items vertically */
            gap: 0.5rem; /* manage space trough cards(divs) -> that's why we used div->flexbox */
            padding: 0.75rem;
            overflow-y: auto;
            flex: 1;
        }

        .app-layout{
            display: flex; /* used to sit list on the left and details on the right */
            gap: 24px;
            max-width: 1600px;
            height: calc(100vh - var(--navbar-height) -2rem);
            margin: 0 auto;
            min-height:600px; /* this can't get smaller than this */
        }

        /* left-column */
        .registry-sidebar{
            width: 240px;
            flex-shrink: 0px; /*?*/
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            overflow: hidden; /*?*/
        }

        .registry-sidebar-header {
            padding: 0.9rem 1rem;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-primary);
            background-color: #f8fafc;
        }
        
        /* center-column */
        .details-panel{
            flex: 1; /* take one share of remaining space (total - sidebars) */
            display: flex;
            gap:1.5rem;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.5rem; /* pads the future elements inside to the actual borders */
            overflow-y: auto; /* ? */
        }

        .actions-sidebar{
            width: 230px;
            flex-shrink: 0; /* does not let other divs squeeze the sidebar */
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5 rem;
            overflow-y: auto; /* only the sidebar get's scrollable */
        }

        .input-group{
            display: flex; /* text on top of the box */
            flex-direction: column;
            gap: 0.35rem; /* gap between label and input */
        }

        .input-group input,
        .input-group select,
        .input-group textarea{
            width: 100%;
            padding: 0.55 rem 0.75 rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: inherit; /* inherit outer font (Inter); */
            font-size: 0.9 rem;
            color: var(--text-primary);
            background-color: var(--bg-surface);
            outline: none;
            transition: border-color 0.2 ease, box-shadow 0.2 ease;
        }

        .input-group textarea{
            resize: vertical; /* automatically reshapes at long text */
            min-height: 90px;
        }

        .input-group input:focus,
        .input-group select:focus,
        .input-group textarea:focus{
            border-color: var(--acent-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .form-section{
            display: flex;
            flex-direction: column;
            gap: 1rem;
            border: 1px solid #e2e8f0;
            background-color: #f8fafc;
            border-radius: var(--radius);
            padding: 1.25rem;
            width: 100%;
        }

        .form-column{
            flex: 1;
            display: flex;
            flex-direction: column;
            /*border: 1px solid violet;*/
            gap: 1.25rem; /* ? */
            min-width: 0;
        }

        .form-row{
            display: flex; /* put the inputs side by side */
            align-items: flex-end; /*keeps input aligned even if one label is longer*/
            gap: 1rem;
        }

        .form-row .input-group{
            flex: 1;
        }

        .check-box-row{
            display: flex;
            align-items: center;
            min-height: 40px;
            justify-content: start;
        }

        .check-box-row input[type="checkbox"]{
            width: 17px;
            height: 17px;
            accent-color: var(--acent-color); /* colors checkmark blue */
            cursor: pointer;
        }

        .check-box-row .hidden-input{
            width: auto; /* keeps the Termen date box compact next to label */
            padding: 0.4rem 0.6rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: inherit;
            font-size: 085 rem;

        }

        .check-box-row label{
            cursor: pointer;
            user-select: None; /* disable text highlight when doubleclicking */
        }

        #label-checkbox{
            margin-right: 1.5px;
        }

        .separator{
        border-top: 1.2px solid rgba(136, 129, 124, 0.356);
        }

        .input-size{
        max-width: 150px;
        min-width: 100px;
        width: auto;
        }

        /*sub-layout structure*/

        .input-group label{
            font-size: 16px;
            color: #4b5563;
            font-weight:bold;
        }

        /* descendent selector(aprent-child replationship) */
        /* find input-group class and apply those rules to any label(tag) inside */
        .input-group input{
            padding: 8px 4px; /* top-bottom left-right */
            /* border: 1px solid #d1d5db; */
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            width: 80%;
        }

        /* add blue ring when clicked inside */
        .input-group input:focus{
            border-color: yellow;
            box-shadow: 0 0 0 1.1px rgba(59, 130, 246, 0.3); /* 0.3 = transparency */
        }

        .input-group select{
        padding: 8px 8px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        font-size: 14px;
        /*color: #111827;*/
        background-color: #ffffff;
        cursor: pointer; /* change hand to a picky one to show it is interactive */
        outline: none; /* standard button highlight (old) */
        width: 70px;
        }

        .input-group select:focus{
        border-color: #3b82f6;
        box-shadow: 0 0 0 1.1px rgba(59, 130, 246, 0.3)
        }

        .check-box-row label{
        font-size: 16px;
        color: #4b5563;
        font-weight:bold;
        margin-right: 1.5px;
        }

        /* -------------------------------------- */

        /* document-card section */
        .document-card{
            background-color: var(--bg-surface);
            border: 1px solid #e2e8f0; /* draw border around box - solid line - color */
            border-left: 4px solid transparent;
            padding: 0.75rem 0.9rem; /* space from the border to not look suffocated */
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease; 
        }

        /* only apply this rules if an element has both teh document-card and active class together */
        /* how does this happen/ look back at prev explain */
        .document-card.active{
            border-color: #bfdbfe;
            border-left-color: var(--accent-color);
        }

        .document-card:hover{
            background-color: #f8fafc;
            border-color: #cbd5e1;
        }

        .doc-number{
            font-weight: 700; /* ticker */
            font-size: 0.95rem;
            color: var(--text-primary);
        }

        .document-card.active .doc-number{
            color: var(--accent-color);
        }

        .doc-date{
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .date-group input{
            width: 150px;
        }

        .section-title{
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-primary);
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 0.25rem;
        }
        /* -------------------------------------- */

        /*proportional split helpers*/

        .flex-2{
            flex: 2 !important; /* overrides other rules in cascade */
        }

        .flex-1{
            flex: 1 !important;
        }

        /* -------------------------------------- */

        /*buttons*/
        .repart-buttons{
            width: 100%;
            padding: 0.6rem 0.85rem;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            border: 1px solid #cdb5e1;
            background-color: #f8fafc;
            color: var(--text-primary);
            /* for what ?*/
            transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }

        .repart-buttons:hover{
            background-color: #e2e8f0;
        }

        .primary-buttons{
            background-color: #2564ebe0;
            border-color: var(--accent-color);
            color: #ffffff;
        }

        .primary-buttons:hover{
            background-color: rgba(19, 174, 230, 0.485);

        }

        .danger-buttons{
            color:  #dc2626;
            background-color: #fef2f2;
            border-color: #fecaca;
        }

        .danger-buttons:hover{
            background-color:  #fee2e2;
             border-color: #fca5a5;
        }

        .filter-buttons{

        }

        }

        .hidden-input{

            border-radius: 4px;
            width:75px;
        }

        #issuer-select{
            width:auto;
        }

        /* # = id, when cecked activate this rule */
        /* class = general, id = specific */
        /* ~ = general sibling (find the elemenet .hidden-input that sits in toggle-extra) */
        /* + = adjacent sibling (targets an element that comes right after) */
        .toggle-extra:checked ~ .hidden-input{
            display: block; /* overrides display:hide */
        }

        .text-modal{
            border: 1px solid green;
        }
