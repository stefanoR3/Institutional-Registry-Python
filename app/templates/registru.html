{% extends "base.html" %}

<!-- we first focus on the page visual with fake hardcoded info to prevent bugs
 to later implement jinja2  -->

{% block content %}
    <head> <!-- head is for rules and settings -->
        <!-- css to style classes -->
        <style>
            body{
                background-color: rgba(1, 35, 54, 0.8);
            }
            .app-layout{
                display: flex; /* used to sit list on the left and details on the right */
                gap: 24px;
                max-width: 1400px;
                margin-top: 20px; /* prevent huge stretch on wide screens */
                margin-left: auto; /* auto calculates automatically the margin needed */
                margin-right:auto; /* top-bottom 0, left-right auto to auto center in browser */
                margin-bottom: 40px;
                padding: 14px; /* outher breathing room */
                border:2px solid blue;
                min-height:400px; /* this can't get smaller than this */
            }

            .registry-list{
                display: flex; /* layout mode, used to stack items in column (cards). Flexbox is a html tool for alignment */
                flex-direction: column; /* stacks items vertically */
                gap: 1px; /* manage space trough cards(divs) -> that's why we used div->flexbox */
                width: 125px; /* without it the div would stretch to the entire width of the screen */
                border:2px solid red; /*debug*/
            }

            .document-card{
                background-color: #ffffff;
                border: 1px solid #d1d5db; /* draw border around box - solid line - color */
                padding: 16 px; /* space from the border to not look suffocated */
                border-radius: 8px; /* make the edges more curvy */

                display: flex; /* row alignment, used to stack number and date in row(card) */
                justify-content: space-between; /* left and right alignment */
                align-items: center; /* alogn them vertically (no up and downs) */
            }

            /* only apply this rules if an element has both teh document-card and active class together */
            .document-card.active{
                background-color: #eff6ff;
                border-color: #3b82f6;
                border-left: 4px solid #2563eb; /* only the left border */
            }

            .doc-number{
                font-weight: bold; /* ticker */
                color:rgb(143, 82, 7); /* text color */
            }

            .doc-date{
                font-size: 14px;
                color:rgb(143, 82, 7);
                margin-top: 4px; /* space from the top */
            }

            .detalis-panel{
                flex: 1; /* take one share of remaining space; it is greedy to take all the right free space. It is not fixed */
                display: flex;
                gap:12px;
                background-color: #ffffff;
                /*border: 1px solid #d1d5fb;*/
                border-radius: 8px;
                padding: 5px; /* pads the future elements inside to the actual borders */
                border: 2px solid green; /*debug*/
            }

            .form-section{
                display: flex;
                flex-direction: column;
                gap: 20px;
                border: 1px solid #e5e7eb;
                border-radius: 6px;
                padding: 6px;
                margin-bottom: 20px; /* outer space */
                width: 280px;
            }

            .form-column{
                display: flex;
                flex-direction: column;
                border: 1px solid violet;
                padding: 1.5px;
            }

            .section-title{
                font-size: 16px;
                color: #374151;
                margin-bottom: 12px;
                border-bottom: 1px solid #e5e7eb;
                padding-bottom: 8px;
            }

            .form-row{
                display: flex; /* puts the inputs side by side */
                /*gap: 20px;*/
                justify-content: space-between;
            }

            .input-group{
                display: flex; /* text on top of the box */
                flex-direction: column;
                gap: 6px; /* gap between label and input */
                border: 1px solid black;
                max-width: 300px;
            }

            .input-group label{
                font-size: 16px;
                color: #4b5563;
                font-weight:bold;
            }

            /* descendent selector(aprent-child replationship) */
            /* find input-group class and apply those rules to any label(tag) inside */
            .input-group input{
                padding: 8px 4px; /* top-bottom left-right */
                border: 1px solid #d1d5db;
                border-radius: 4px;
                font-size: 14px;
                outline: none;
                width: 115px;
            }

            /* add blue ring when clicked inside */
            .input-group input:focus{
                border-color: yellow;
                box-shadow: 0 0 0 1.1px rgba(59, 130, 246, 0.3); /* 0.3 = transparency */
            }

            .input-group select{
                width: 70px;
            }

            #date input{
                width: 75px;
            }

            .input-group select{
                padding: 8px 8px;
                border: 1px solid #d1d5db;
                border-radius: 4px;
                font-size: 14px;
                color: #111827;
                background-color: #ffffff;
                cursor: pointer; /* change hand to a picky one to show it is interactive */
                outline: none; /* standard button highlight (old) */
            }

            .input-group select:focus{
                border-color: #3b82f6;
                box-shadow: 0 0 0 1.1px rgba(59, 130, 246, 0.3)
            }

            .hidden-input{
                display: none; /* invisible */
                margin-top: 4px;
                padding: 8px 12px;
                border: 1px solid #d1d5db;
                border-radius: 4px;
                width:75px;
            }

            #issuer-select{
                width:auto;
            }

            /* # = id, when cecked activate this rule */
            /* class = general, id = specific */
            /* ~ = general sibling (find the elemenet .hidden-input that sits in toggle-extra) */
            /* + = adjacent sibling (targets an element that comes right after) */
            .toggle-extra:checked ~ .hidden-input{
                display: block; /* overrides display:hide */
            }

            .separator{
                border-top: 1.2px solid saddlebrown;
            }

            .input-size{
                max-width: 150px;
                min-width: 100px;
                width: auto;
            }

            .check-box-row{
                display: flex;
                align-items: center;
                min-height: 40px;
                justify-content:start;
            }

            .check-box-row label{
                font-size: 16px;
                color: #4b5563;
                font-weight:bold;
            }

            .text-modal{
                border: 1px solid green;
            }

            .repart-buttons{
                background-color: rgba(25, 240, 176, 0.1);
                border: 2px solid rgba(25, 240, 176, 0.2);
                border-radius: 4px;
                text-align: center;
                width: 200px;
                cursor: pointer;
                padding:2px 4px;
                margin: 1px 0px;
            }

            #first-column{
            width:300px;
            }

            #second-column{
                width: 500px;
                flex-direction: row;
            }

            #third-column{
                width: 280px;
                height: auto;
            }

            #second-fs{
                height: 250px;
                width: 250px;
            }

            #third-fs{
                height: auto;
                width:250px;
            }

            #aux-input-1{
                width:200px;
            }

            #aux-input-2{
                width:200px;
            }

            #la-data{
                width: 110px;
            }

            #close{
                margin-top: 20px;
                background-color: rgba(240, 164, 12, 0.245);
                border: 2px solid rgba(240, 25, 64, 0.295);
                border-radius: 4px;
                text-align: center;
                width: 200px;
                cursor: pointer;
                padding:2px 4px;
            }

            .button-list{
                background-color: rgba(25, 240, 176, 0.1);
                border: 2px solid rgba(25, 240, 176, 0.2);
                border-radius: 4px;
                text-align: center;
                width: 200px;
                cursor: pointer;
                padding:2px 4px;
            }
        </style>
    </head>
    <body>
        <div class="app-layout">
            <div class="sidebar"> <!-- for future feets -->
                <div class="registry-list">
                    <div class="document-card active"> <!-- this div inherit both document-card and active class-->
                        <div class="doc-number">56456</div>
                        <div class="doc-date">30/09/2026</div>
                    </div>
                    <div class="document-card">
                        <div class="doc-number">18985</div> <!-- div stands for division (empty box)-->
                        <div class="doc-date">28/09/2026</div> <!-- we can think the class a sticky note to css-->
                    </div>
                </div>
            </div>
            <div class="detalis-panel"> <!-- first grouped section -->
                <!--<h3 class="section-title">Document - Intrare</h3>-->
                <div class="form-column" id="first-column">
                    <div class="form-section">
                        <div class="form-row"><!-- numar/data -->
                            <div class="input-group" id="number"> <!-- input: document number -->
                                <label>Număr document</label>
                                <input type="text" value="675787">
                            </div>
                            <div class="input-group" id="date"> <!-- input: document date -->
                                <label>din data:</label>
                                <input type="date" value="20/02/2026">
                            </div>
                        </div>
                        <div class="separator"></div>
                        <div class="form-row">
                            <div class="input-group"> <!-- mod intrare/tip intrare-->
                                <label>Mod intrare</label>
                                <select>
                                    <option value="mail">mail</option>
                                    <option value="poștă">poștă</option>
                                    <option value="direct">direct</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label>Tip intrare</label>
                                <select>
                                <!-- to ask to prof -->
                                    <option value="hardcore">aux</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="form-section">
                        <div class="input-group">
                            <label>Emitent</label>
                            <select id="issuer-select">
                                <option value="Maria Dascalu">Maria Dascalu</option>
                                <option value=""Marina Apreotesei">Marina Apreotesei</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Nr înregistrare emitent</label>
                            <input type="text" value="">
                        </div>
                        <div class="separator"></div>
                        <div class="check-box-row">
                            <label for="toggle-extra">Termen</label> <!-- clicking for will ceck the box-->
                            <input type="checkbox" class="toggle-extra">
                            <input type="text" class="hidden-input">
                        </div>
                    </div>
                </div>
                <div class="form-column" id="second-column">
                    <div class="form-section" id="second-fs">
                        <div class="check-box-row">
                            <label for="toggle-extra">Document repartizat</label>
                            <input type="checkbox" class="toggle-extra">
                        </div>      <!-- css can only style!-->
                        <div class="input-group" id="aux-input-2">
                            <button type="button" class="repart-buttons">Modifică repartizări</button>
                            <button type="button" class="repart-buttons">Vezi repartizări</button>
                            <button type="button" class="repart-buttons">Anulează repartizări</button>
                        </div>
                        <div class="separator"></div>
                        <div class="input-group" id="aux-input-1">
                            <label>Conținut intrare</label>
                            <input type="text" value="">
                        </div>
                    </div>
                    <div class="form-section" id="third-fs">
                        <div class="check-box-row">
                            <label for class="toggle-extra">Soluționat/Răspuns</label>
                            <input type="checkbox" >
                        </div>
                        <div class="separator"></div>
                        <div class="form-row">
                            <div class="input-group" id="date">
                                <label>la data</label>
                                <input type="date" value="20/02/2026">
                            </div>
                            <div class="input-group">
                                <label>Nr-I-Dest</label>
                                <input type="text" value=""> 
                            </div>
                        </div>
                        <div class="separator"></div>
                        <div class="input-group">
                            <label>Conținut ieșire</label>
                            <input type="text" value="">
                        </div>
                        <div class="input-group">
                            <label>Mod ieșire</label>
                            <select>
                                <option value="mail">mail</option>
                                <option value="poștă">poștă</option>
                                <option value="direct">direct</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="form-column" id="third-column">
                    <div class="input-group">
                        <button type="button" class="repart-buttons">Asociere Document</button>
                        <button tpye="button" class="repart-buttons">Modificare Document</button>
                        <button type="button" class="repart-buttons">Anulare Raspuns</button>
                        <button tpye="button" class="repart-buttons">Anulare Document</button>
                        <button tpye="button" class="repart-buttons">Stergere Document</button>
                        <button tpye="button" class="repart-buttons">Adaugare Intrare</button>
                        <button type="button" class="repart-buttons">Adaugare Iesire</button>
                        <button type="button" class="repart-buttons">Filtrare</button>
                        <button type="button" class="repart-buttons">Anulare Filtrare</button>
                        <button type="button" class="repart-buttons" id="close">Inchidere</button>
                    </div>
                </div>
            </div>
        </div>
    </body>
{% endblock %}
