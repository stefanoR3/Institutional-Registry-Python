<!-- we first focus on the page visual with fake hardcoded info to prevent bugs
 to later implement jinja2  -->

{% block content %}
    <head> <!-- head is for rules and settings -->
        <!-- css to style classes -->
        <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js" integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg" crossorigin="anonymous"></script>
        <style>
            body{
                background-color: rgba(1, 35, 54, 0.8);
            }
            
            /* layout structure */

                .registry-list{
                    display: flex; /* layout mode, used to stack items in column (cards). Flexbox is a html tool for alignment */
                    flex-direction: column; /* stacks items vertically */
                    gap: 1px; /* manage space trough cards(divs) -> that's why we used div->flexbox */
                    width: 125px; /* without it the div would stretch to the entire width of the screen */
                    /*border:2px solid; red; /*debug*/
                }

                .app-layout{
                    display: flex; /* used to sit list on the left and details on the right */
                    gap: 24px;
                    max-width: 1400px;
                    margin-top: 20px; /* prevent huge stretch on wide screens */
                    margin-left: auto; /* auto calculates automatically the margin needed */
                    margin-right:auto; /* top-bottom 0, left-right auto to auto center in browser */
                    margin-bottom: 40px;
                    padding: 14px; /* outher breathing room */
                    /* border:2px solid blue; */
                    min-height:400px; /* this can't get smaller than this */
                    height: 800px;
                }

                .details-panel{
                    flex: 1; /* take one share of remaining space; it is greedy to take all the right free space. It is not fixed */
                    display: flex;
                    gap:12px;
                    background-color: #ffffff;
                    /*border: 1px solid #d1d5fb;*/
                    border-radius: 8px;
                    padding: 5px; /* pads the future elements inside to the actual borders */
                    border: 2px solid rgba(29, 228, 238, 0.528); /*debug*/
                    /* background-color: #374151; */
                }

                .input-group{
                    display: flex; /* text on top of the box */
                    flex-direction: column;
                    gap: 6px; /* gap between label and input */
                    /* border: 1px solid black; */
                    max-width: 300px;
                }

                .form-section{
                    display: flex;
                    flex-direction: column;
                    gap: 20px;
                    border: 1px solid #e5e7eb;
                    border-radius: 6px;
                    padding: 6px;
                    margin-bottom: 20px; /* outer space */
                    width: 280px;
                }

                .form-column{
                    display: flex;
                    flex-direction: column;
                    /*border: 1px solid violet;*/
                    padding: 1.5px;
                }

                .form-row{
                    display: flex; /* put the inputs side by side */
                    /*gap: 20px;*/
                    justify-content: space-between;
                }

                .check-box-row{
                    display: flex;
                    align-items: center;
                    min-height: 40px;
                    justify-content:start;
                }

                .separator{
                border-top: 1.2px solid saddlebrown;
                }

                .input-size{
                max-width: 150px;
                min-width: 100px;
                width: auto;
                }

            /*sub-layout structure*/

                .input-group label{
                    font-size: 16px;
                    color: #4b5563;
                    font-weight:bold;
                }

                /* descendent selector(aprent-child replationship) */
                /* find input-group class and apply those rules to any label(tag) inside */
                .input-group input{
                    padding: 8px 4px; /* top-bottom left-right */
                    /* border: 1px solid #d1d5db; */
                    border-radius: 4px;
                    font-size: 14px;
                    outline: none;
                    width: 80%;
                }

                /* add blue ring when clicked inside */
                .input-group input:focus{
                    border-color: yellow;
                    box-shadow: 0 0 0 1.1px rgba(59, 130, 246, 0.3); /* 0.3 = transparency */
                }

                .input-group select{
                padding: 8px 8px;
                border: 1px solid #d1d5db;
                border-radius: 4px;
                font-size: 14px;
                /*color: #111827;*/
                background-color: #ffffff;
                cursor: pointer; /* change hand to a picky one to show it is interactive */
                outline: none; /* standard button highlight (old) */
                 width: 70px;
                }

                .input-group select:focus{
                border-color: #3b82f6;
                box-shadow: 0 0 0 1.1px rgba(59, 130, 246, 0.3)
                }

                .check-box-row label{
                font-size: 16px;
                color: #4b5563;
                font-weight:bold;
                }

            /* -------------------------------------- */

            /* document-card section */
                .document-card{
                    background-color: #ffffff;
                    border: 1px solid #d1d5db; /* draw border around box - solid line - color */
                    padding: 16 px; /* space from the border to not look suffocated */
                    border-radius: 8px; /* make the edges more curvy */

                    display: flex; /* row alignment, used to stack number and date in row(card) */
                    justify-content: space-between; /* left and right alignment */
                    align-items: center; /* alogn them vertically (no up and downs) */
                }

                /* only apply this rules if an element has both teh document-card and active class together */
                .document-card.active{
                    background-color: #eff6ff;
                    /*border-color: #3b82f6;*/
                    border-left: 4px solid #2563eb; /* only the left border */
                }

                .doc-number{
                    font-weight: bold; /* ticker */
                    color:rgb(143, 82, 7); /* text color */
                }

                .doc-date{
                    font-size: 14px;
                    color:rgb(143, 82, 7);
                    margin-top: 4px; /* space from the top */
                }

                #date input{
                    width: 75px;
                }

            /* -------------------------------------- */

            /*buttons*/
                .repart-buttons{
                    background-color: rgba(25, 240, 176, 0.1);
                    border: 2px solid rgba(25, 240, 176, 0.2);
                    border-radius: 4px;
                    text-align: center;
                    width: 200px;
                    cursor: pointer;
                    padding:2px 4px;
                    margin: 1px 0px;
                }

                .filter-buttons{
                    background-color: rgba(62, 78, 201, 0.356);
                    border: 2px solid rgba(53, 248, 228, 0.201);
                    border-radius: 4px;
                    text-align: center;
                    width: 200px;
                    height:50px;
                    cursor: pointer;
                    padding:2px 4px;
                    margin: 1px 0px;
                    font-family: Tahoma;
                    font-weight: 300;

                height: 100px;
                vertical-align: top;
                box-sizing: border-box;
            }

            .section-title{
                font-size: 16px;
                color: #374151;
                margin-bottom: 12px;
                border-bottom: 1px solid #e5e7eb;
                padding-bottom: 8px;

            .hidden-input{

                border: 1px solid #d1d5db;
                border-radius: 4px;
                width:75px;
            }

            #issuer-select{
                width:auto;
            }

            /* # = id, when cecked activate this rule */
            /* class = general, id = specific */
            /* ~ = general sibling (find the elemenet .hidden-input that sits in toggle-extra) */
            /* + = adjacent sibling (targets an element that comes right after) */
            .toggle-extra:checked ~ .hidden-input{
                display: block; /* overrides display:hide */
            }

                border: 1px solid green;
            }

             /* -------------------------------------- */

        </style>
